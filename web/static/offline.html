<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>离线模式 - mhgl 小说站</title>
<style>
  body{margin:0;background:#f4f4f4;color:#666;font:14px/1.7 "Microsoft YaHei",Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:420px;margin:0 16px;background:#fff;border:1px solid #e3e3e3;padding:36px 28px;text-align:center}
  .code{font-size:52px;font-weight:800;color:#0f766e;line-height:1}
  h1{font-size:19px;color:#555;margin:14px 0 6px}
  p{margin:0 0 18px;color:#999}
  a.btn{display:inline-block;border:1px solid #0f766e;color:#0f766e;border-radius:3px;padding:8px 22px;text-decoration:none;font-size:14px}
  a.btn:hover{background:#0f766e;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="code">⚡</div>
  <h1>当前处于离线模式</h1>
  <p>网络连接不可用, 该页面尚未缓存。<br>已访问过的页面可在离线时继续阅读。</p>
  <a class="btn" href="/">重试返回首页</a>
</div>
</body>
</html>

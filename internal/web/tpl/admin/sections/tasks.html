{{define "content"}}
<section class="adm-card">
  <div class="adm-card-head">
    <h2>采集任务</h2>
    <div class="adm-toolbar">
      <select class="adm-input is-select" id="task-filter-status" aria-label="状态筛选">
        <option value="">全部状态</option>
        <option value="running">运行中</option>
        <option value="paused">已暂停</option>
        <option value="pending">等待中</option>
        <option value="done">已完成</option>
        <option value="error">错误</option>
        <option value="stopped">已停止</option>
      </select>
      <button class="adm-btn is-tiny" id="task-refresh" type="button">刷新</button>
      <button class="adm-btn is-primary is-tiny" id="task-new" type="button">＋ 新建任务</button>
    </div>
  </div>
  <div id="task-list" class="adm-state">加载中…</div>
</section>
<section class="adm-card" id="task-log-card" style="display:none">
  <div class="adm-card-head">
    <h2 id="task-log-title">任务日志</h2>
    <div class="adm-toolbar">
      <!-- [R75-e] 日志级别过滤: 服务端 level 参数; 默认全部, 错误行红色高亮(既有 is-error 样式) -->
      <select class="adm-input is-select" id="task-log-level" aria-label="日志级别过滤">
        <option value="">全部级别</option>
        <option value="error">仅错误</option>
        <option value="warn">仅警告</option>
        <option value="success">仅成功</option>
        <option value="info">仅信息</option>
      </select>
      <label class="adm-label is-check"><input type="checkbox" id="task-log-auto"> 自动刷新</label>
      <button class="adm-btn is-tiny" id="task-log-close" type="button">关闭</button>
    </div>
  </div>
  <div id="task-log-view" class="adm-logview"><div class="adm-state">—</div></div>
</section>
{{end}}

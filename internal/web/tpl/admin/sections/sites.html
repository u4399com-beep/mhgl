{{define "content"}}
<section class="adm-card">
  <div class="adm-card-head">
    <h2>站群系统</h2>
    <div class="adm-toolbar">
      <button class="adm-btn is-tiny" id="site-refresh" type="button">刷新</button>
      <button class="adm-btn is-primary is-tiny" id="site-new" type="button">＋ 新建站点</button>
    </div>
  </div>
  <div id="site-list" class="adm-state">加载中…</div>
</section>
<section class="adm-card">
  <div class="adm-card-head">
    <h2>智能 TDK 填充</h2>
    <div class="adm-toolbar">
      <button class="adm-btn is-tiny" id="stdk-refresh" type="button">刷新</button>
    </div>
  </div>
  <p class="adm-muted" style="margin:0 0 10px">预设 18 套符合 SEO 的 TDK 模板(标题/描述/关键词)，按站点勾选启用若干套并选择各页类型策略；每次页面渲染从启用套中随机抽一套组合填充，未开启的页保持原有 TDK 逻辑。</p>
  <div id="stdk-body" class="adm-state">加载中…</div>
</section>
{{end}}

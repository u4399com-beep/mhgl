{{define "content"}}
<div class="x2-page">
  <div class="x2-bdtop"></div>
  <div class="x2-bdsub">
    <dl class="x2-dl x2-read-dl">
      <dt class="x2-crumb"><a class="x2-a" href="{{.HomeHref}}">首页</a>-&gt;<a class="x2-a" href="{{.BookHref}}">{{.Book.name}}</a>-&gt;{{.Chapter.title}}</dt>
      <dd data-page="read" data-book-id="{{.Book.id}}" data-chapter-id="{{.Chapter.id}}" data-chapter-title="{{.Chapter.title}}">
        <h1 class="x2-read-h1">{{.Chapter.title}}</h1>
        <div class="x2-setbar">
          <b>字号</b>
          <a class="x2-a ajx-s" href="javascript:void(0)" data-fs="14">A-</a>
          <a class="x2-a ajx-s" href="javascript:void(0)" data-fs="17">A</a>
          <a class="x2-a ajx-s" href="javascript:void(0)" data-fs="20">A+</a>
          <b>背景</b>
          <span role="group" aria-label="背景色">
            <a class="ajx-c x2-c" style="background:#ffffff" href="javascript:void(0)" data-bg="#ffffff" aria-label="背景 白"></a>
            <a class="ajx-c x2-c" style="background:#e8edf5" href="javascript:void(0)" data-bg="#e8edf5" aria-label="背景 蓝灰"></a>
            <a class="ajx-c x2-c" style="background:#e6efe6" href="javascript:void(0)" data-bg="#e6efe6" aria-label="背景 浅绿"></a>
            <a class="ajx-c x2-c" style="background:#f5e9d8" href="javascript:void(0)" data-bg="#f5e9d8" aria-label="背景 米黄"></a>
          </span>
          <b>字色</b>
          <span class="ajx-ys" role="group" aria-label="字体颜色">
            <a class="x2-ys-a" href="javascript:void(0)" data-ink="#666666" style="color:#666666">灰</a>
            <a class="x2-ys-a" href="javascript:void(0)" data-ink="#2f468f" style="color:#2f468f">蓝</a>
            <a class="x2-ys-a" href="javascript:void(0)" data-ink="#333333" style="color:#333333">黑</a>
          </span>
        </div>
        <div class="x2-reader">
          {{if .Chapter.content}}
          <div id="view_content_txt" class="x2-read-txt">{{readHTML (str .Chapter.content)}}</div>
          {{else}}
          <div id="view_content_txt" class="x2-read-txt"><div class="x2-empty">本章内容尚未采集, 请稍后再来或返回目录阅读其他章节。</div></div>
          {{end}}
        </div>
        <div class="x2-bottem">
          {{if .PrevHref}}<a class="x2-btn" id="ajx-prev" href="{{.PrevHref}}" rel="prev">上一章</a>{{else}}<span class="x2-btn is-disabled" id="ajx-prev" aria-disabled="true">上一章</span>{{end}}
          <a class="x2-btn" href="{{.TocHref}}">目录</a>
          {{if .NextHref}}<a class="x2-btn" id="ajx-next" href="{{.NextHref}}" rel="next">下一章</a>{{else}}<span class="x2-btn is-disabled" id="ajx-next" aria-disabled="true">下一章</span>{{end}}
        </div>
      </dd>
    </dl>
  </div>
</div>
{{end}}

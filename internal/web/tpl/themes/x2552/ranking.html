{{define "content"}}
<div class="x2-page">
  <div class="x2-flex">
    <div class="x2-left">{{template "x2-leftrail" .}}</div>
    <div class="x2-centerm">
      {{range .Boards}}
      <div class="x2-bdtop"></div>
      <div class="x2-bdsub">
        <dl class="x2-dl">
          <dt class="x2-dt-line">{{.Label}}<small class="x2-dt-sub">(TOP60 · 每小时随采集更新)</small></dt>
          <dd>{{template "x2-booktable" (withSite $.SiteID .Books)}}</dd>
        </dl>
      </div>
      {{end}}
    </div>
  </div>
</div>
{{end}}
